<!DOCTYPE html>
<html>

    <head>
        <title>Matrix Text Waterfall</title>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=settings" />
        <script src="index.js" defer></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>

    <body>
        <div id="settings">
            <button class="settings-button settings-black" onclick="toggleSettings()">
                <span class="material-symbols-outlined">
                    settings
                </span>
            </button>

            <div id="settingsPanel" class="settings-panel settings-success settings-display-container" style="display: block;">
                <p>Settings:</p><br>
                <label for="color">Color:</label>
                <input type="color" id="color" value="#00ff99"><br>
                <input type="button" value="Toggle Raindbow"><br>
                <input type="button" value="Toggle Fading"><br>
                <input type="button" value="Toggle Debug"><br>
                <input type="button" value="Pause"><br>
                <label for="inputColumns">Columns:</label><br>
                <input type="text" id="inputColumns" value="getNumColumns()"><br>
                <label for="inputRows">Rows:</label><br>
                <input type="text" id="inputRows" value="80"><br>
                <label for="inputChars">Character Set:</label><br>
                <input type="text" id="inputChars" value="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789⚥"><br>
                <label for="inputFPS">FPS:</label><br>
                <input type="text" id="inputFPS" value="30"><br>
                <input type="submit" value="Save Settings"><br>
                <input type="button" value="Reset to Default">
            </div>
        </div>
        <canvas id="matrixCanvas"></canvas>
    </body>

</html>
